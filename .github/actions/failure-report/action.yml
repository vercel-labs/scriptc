name: Keep the CI failure report
description: >-
  Upload the tests a job reported as failing, which scripts/ci-failure-reporter.mjs wrote under
  $SCRIPTC_CI_FAILURE_ARCHIVE. The post-merge culprit search (.github/workflows/bisect-main.yml) re-runs exactly
  those tests at each commit it probes.
inputs:
  name:
    description: The artifact name, unique within the workflow run.
    required: true
runs:
  using: composite
  steps:
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: ${{ inputs.name }}
        path: ${{ github.workspace }}/ci-failures
        if-no-files-found: ignore
        retention-days: 7
