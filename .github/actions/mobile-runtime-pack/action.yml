name: Mobile runtime pack
description: Build and verify a mobile runtime pack with the release toolchain
inputs:
  runtime:
    description: Mobile runtime package directory name
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version-file: .node-version
    - name: Install Android NDK
      if: inputs.runtime == 'runtime-android-arm64'
      shell: bash
      run: |
        "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018"
        echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
    - uses: ./.github/actions/icu-downloads
    - name: Build and verify mobile runtime pack
      shell: bash
      env:
        SCRIPTC_MOBILE_RUNTIME: ${{ inputs.runtime }}
      run: |
        node "packages/$SCRIPTC_MOBILE_RUNTIME/scripts/build.mjs"
        node "packages/$SCRIPTC_MOBILE_RUNTIME/scripts/verify.mjs"
