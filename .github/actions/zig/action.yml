name: Pinned Zig
description: Reuse the verified Zig installation across hosted runners
runs:
  using: composite
  steps:
    - name: Resolve the Zig target
      id: target
      shell: bash
      run: |
        case "${{ runner.os }}-${{ runner.arch }}" in
          Linux-X64) target=x86_64-linux ;;
          Linux-ARM64) target=aarch64-linux ;;
          macOS-X64) target=x86_64-macos ;;
          macOS-ARM64) target=aarch64-macos ;;
          Windows-X64) target=x86_64-windows ;;
          *) target="" ;;
        esac
        echo "target=$target" >> "$GITHUB_OUTPUT"
        if [ -n "$target" ]; then
          echo "supported=true" >> "$GITHUB_OUTPUT"
        else
          echo "supported=false" >> "$GITHUB_OUTPUT"
        fi
    - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      id: zig
      with:
        path: ${{ runner.tool_cache }}/zig/0.16.0
        # The pin file and the layout marker are part of the key, so a cache never outlives the digest its archive
        # was checked against or a change in where the archive is unpacked.
        key: zig-0.16.0-${{ runner.os }}-${{ runner.arch }}-target-v1-${{ hashFiles('scripts/toolchain.sha256') }}
    # A cache hit is only usable when the directory holds Zig 0.16.0 where this action and setup-zig put it.
    # Anything else (another layout, a corrupt archive) is dropped, and the install steps below fill it again.
    - name: Check the restored Zig
      id: restored
      if: steps.zig.outputs.cache-hit == 'true'
      shell: bash
      run: |
        zig="$RUNNER_TOOL_CACHE/zig/0.16.0/${{ steps.target.outputs.target }}"
        if [ "${{ runner.os }}" = "Windows" ]; then binary="$zig/zig.exe"; else binary="$zig/zig"; fi
        version=
        if [ -f "$binary" ]; then version=$("$binary" version 2>/dev/null) || version=; fi
        if [ "$version" = "0.16.0" ]; then
          echo "usable=true" >> "$GITHUB_OUTPUT"
        else
          echo "::warning::the restored Zig is not 0.16.0 at $zig; installing it from the pinned archive"
          rm -rf "$RUNNER_TOOL_CACHE/zig/0.16.0"
        fi
    # The archive comes from Zig's mirrors and release host, checked against its pinned digest before anything
    # unpacks it. The installers exit nonzero without installing when no source serves the archive; the steps
    # record that instead of failing, so the setup-zig fallback below runs.
    - name: Install pinned Zig (POSIX)
      id: pinned
      if: steps.restored.outputs.usable != 'true' && steps.target.outputs.supported == 'true' && runner.os != 'Windows'
      shell: bash
      run: |
        if sh scripts/install-zig.sh 0.16.0 "$RUNNER_TOOL_CACHE/zig/0.16.0"; then
          echo "installed=true" >> "$GITHUB_OUTPUT"
          echo "dir=$RUNNER_TOOL_CACHE/zig/0.16.0/${{ steps.target.outputs.target }}" >> "$GITHUB_OUTPUT"
        else
          echo "::warning::no source served the pinned Zig archive; installing Zig with setup-zig"
          rm -rf "$RUNNER_TOOL_CACHE/zig/0.16.0/${{ steps.target.outputs.target }}"
          echo "installed=false" >> "$GITHUB_OUTPUT"
        fi
    - name: Download pinned Zig (Windows)
      id: windows-download
      if: steps.restored.outputs.usable != 'true' && steps.target.outputs.supported == 'true' && runner.os == 'Windows'
      shell: bash
      run: |
        archive="zig-x86_64-windows-0.16.0.zip"
        # Keep these sources in step with the ones in scripts/install-zig.sh.
        sources="
        https://pkg.machengine.org/zig
        https://pkg.hexops.org/zig
        https://zig.linus.dev/zig
        https://zig.vortan.dev/zig
        https://ziglang.org/download/0.16.0"
        deadline=$(($(date +%s) + 600))
        downloaded=
        for base in $sources; do
          remaining=$((deadline - $(date +%s)))
          [ "$remaining" -gt 0 ] || break
          echo "downloading $archive from $base"
          if curl --fail --silent --show-error --location --connect-timeout 15 --max-time "$remaining" \
              --speed-limit 1024 --speed-time 60 "$base/$archive" --output "$RUNNER_TEMP/$archive" &&
            sh scripts/verify-toolchain.sh "$RUNNER_TEMP/$archive" "$archive"; then
            downloaded=1
            break
          fi
          echo "::warning::$base did not provide $archive; trying the next source"
          rm -f "$RUNNER_TEMP/$archive"
        done
        if [ -n "$downloaded" ]; then
          echo "installed=true" >> "$GITHUB_OUTPUT"
        else
          echo "::warning::no source served the pinned Zig archive; installing Zig with setup-zig"
          echo "installed=false" >> "$GITHUB_OUTPUT"
        fi
    # windows-2022 and windows-latest include 7-Zip, which expands the archive faster than tar.exe does.
    - name: Install pinned Zig (Windows)
      id: windows-install
      if: steps.windows-download.outputs.installed == 'true'
      shell: pwsh
      run: |
        $archive = "$env:RUNNER_TEMP\zig-x86_64-windows-0.16.0.zip"
        $destination = "$env:RUNNER_TOOL_CACHE\zig\0.16.0\${{ steps.target.outputs.target }}"
        $expanded = "$env:RUNNER_TEMP\zig-expanded"
        $sevenZip = "$env:ProgramFiles\7-Zip\7z.exe"
        if (-not (Test-Path $sevenZip)) {
          choco install 7zip --no-progress -y
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        }
        if (-not (Test-Path $sevenZip)) { throw "7-Zip is unavailable" }
        Remove-Item -Recurse -Force $expanded -ErrorAction SilentlyContinue
        & $sevenZip x -y "-o$expanded" $archive
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        $root = Join-Path $expanded "zig-x86_64-windows-0.16.0"
        if (-not (Test-Path $root)) { throw "$archive has no zig-x86_64-windows-0.16.0 directory" }
        Remove-Item -Recurse -Force $destination -ErrorAction SilentlyContinue
        New-Item -ItemType Directory -Force (Split-Path $destination) | Out-Null
        Move-Item $root $destination
        echo "dir=$destination" >> $env:GITHUB_OUTPUT
    # Only when the platform has no pin, no source served the archive, or the cache was unusable.
    - id: fallback
      uses: vercel-labs/setup-zig@83c1594f26b86da8a9a8ddd9b5ee5f3af0f96943 # v1.0.2
      if: steps.restored.outputs.usable != 'true' && steps.pinned.outputs.installed != 'true' && steps.windows-download.outputs.installed != 'true'
      with:
        version: 0.16.0
    # Select Zig finds the directory from the step that provided the install, so it does not depend on any one
    # installer's layout: the pinned install's `dir` output, setup-zig's `zig-path` output, or the cache path
    # for a usable hit. `command -v zig` is the last resort, for a setup-zig that only updated PATH.
    - name: Select Zig
      if: steps.target.outputs.supported == 'true' && runner.os != 'Windows' && (steps.restored.outputs.usable == 'true' || steps.pinned.outputs.installed == 'true' || steps.fallback.outcome == 'success')
      shell: bash
      run: |
        zig="${{ steps.pinned.outputs.dir }}"
        if [ -z "$zig" ] && [ -n "${{ steps.fallback.outputs.zig-path }}" ]; then
          zig=$(dirname "${{ steps.fallback.outputs.zig-path }}")
        fi
        if [ -z "$zig" ] && [ "${{ steps.restored.outputs.usable }}" = "true" ]; then
          zig="$RUNNER_TOOL_CACHE/zig/0.16.0/${{ steps.target.outputs.target }}"
        fi
        if [ -z "$zig" ] && command -v zig >/dev/null 2>&1; then
          zig=$(dirname "$(command -v zig)")
        fi
        if [ -z "$zig" ]; then
          echo "::error::no Zig 0.16.0 installation to select"
          exit 1
        fi
        test "$("$zig/zig" version)" = "0.16.0"
        echo "$zig" >> "$GITHUB_PATH"
    - name: Select Zig (Windows)
      if: steps.target.outputs.supported == 'true' && runner.os == 'Windows' && (steps.restored.outputs.usable == 'true' || steps.windows-download.outputs.installed == 'true' || steps.fallback.outcome == 'success')
      shell: pwsh
      run: |
        $zig = "${{ steps.windows-install.outputs.dir }}"
        if (-not $zig -and "${{ steps.fallback.outputs.zig-path }}") {
          $zig = Split-Path "${{ steps.fallback.outputs.zig-path }}"
        }
        if (-not $zig -and "${{ steps.restored.outputs.usable }}" -eq "true") {
          $zig = "$env:RUNNER_TOOL_CACHE\zig\0.16.0\${{ steps.target.outputs.target }}"
        }
        if (-not $zig -and (Get-Command zig -ErrorAction SilentlyContinue)) {
          $zig = Split-Path (Get-Command zig).Source
        }
        if (-not $zig) { throw "no Zig 0.16.0 installation to select" }
        $version = (& "$zig\zig.exe" version).Trim()
        if ($LASTEXITCODE -ne 0 -or $version -ne "0.16.0") {
          throw "Zig at $zig reports '$version', not 0.16.0"
        }
        echo $zig >> $env:GITHUB_PATH
    # On a pinned platform the cache holds the directory either installer filled (setup-zig installs to the same
    # <tool cache>/zig/0.16.0/<target> path), so a fallback seeds it and later runs take the hit and skip every
    # download. Unpinned platforms are not cached: their fallback sets PATH each run, and a hit would skip it.
    - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      if: steps.target.outputs.supported == 'true' && steps.restored.outputs.usable != 'true' && (steps.pinned.outputs.installed == 'true' || steps.windows-download.outputs.installed == 'true' || steps.fallback.outcome == 'success')
      with:
        path: ${{ runner.tool_cache }}/zig/0.16.0
        key: ${{ steps.zig.outputs.cache-primary-key }}
