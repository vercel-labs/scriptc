name: CI review gate

# A pull request runs the fast tier by default; the ci:full label asks for the full suite in the pull request's
# own run. This workflow keeps a way to start a pull request's full tier by hand, on its branch, in the pull
# request's concurrency group and cache scope, without touching its labels. It never runs pull request code: it
# checks out the default branch's gate script.
on:
  # Start a pull request's full tier by hand.
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true
        type: string
      # A fork's own CI run is never trusted (it runs the fork's workflow files). A maintainer who has checked it,
      # workflow files included, records the commit as passed with this. The sha names that commit: approval covers
      # it alone, so a push that lands before the gate runs leaves the new head unapproved.
      sha:
        description: For a fork's pull request with fork_attest, the full sha of the commit whose CI run you checked
        type: string
      fork_attest:
        description: For a fork's pull request, record the check as passed on sha (after checking its CI run and workflow files)
        type: boolean
        default: false

permissions:
  contents: read

# One dispatch at a time per pull request.
concurrency:
  group: ci-review-gate-${{ inputs.pr || github.run_id }}
  cancel-in-progress: false

jobs:
  gate:
    name: Start the expensive CI tier
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
      checks: read
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            .node-version
            scripts/ci-review-gate.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Gate
        env:
          GH_TOKEN: ${{ github.token }}
        # Until this workflow's script is on the default branch (the pull request that adds it), there is no gate.
        run: |
          if [ ! -f scripts/ci-review-gate.mjs ]; then
            echo "::notice::The default branch has no scripts/ci-review-gate.mjs yet; nothing to gate"
            exit 0
          fi
          node scripts/ci-review-gate.mjs
