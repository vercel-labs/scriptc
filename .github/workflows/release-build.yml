name: Release build

# Builds every native package a release publishes: the LLVM helper, runtime
# pack and native CLI of each platform on its matching host, and the mobile
# runtime packs. Each uploads as a native-<platform> artifact of the calling
# run. Nothing here publishes.
#
# Two workflows call it, so the release and its rehearsal build exactly the
# same way:
# - release.yml, before it publishes;
# - release-dry-run.yml, nightly on main and on pull requests that prepare a
#   release or change how it builds, so a package that no longer builds shows
#   up before a release run instead of in it.

on:
  workflow_call:
    inputs:
      collected-profile:
        description: >-
          Build the native CLIs with the cli-profile artifact the calling run collected on this commit, and warn
          when it is missing. Without it they build with the committed profile and layout.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  native:
    name: Build native package (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-15
            helper: llvm-darwin-arm64
            runtime: runtime-darwin-arm64
            cli: cli-darwin-arm64
          - platform: darwin-x64
            runner: macos-15-intel
            helper: llvm-darwin-x64
            runtime: runtime-darwin-x64
            cli: cli-darwin-x64
          - platform: linux-x64
            runner: ubuntu-24.04
            helper: llvm-linux-x64-gnu
            runtime: runtime-linux-x64-gnu
            cli: cli-linux-x64-gnu
            llvm_asset: LLVM-22.1.8-Linux-X64
            llvm_dist: x64
            use_zig: true
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            helper: llvm-linux-arm64-gnu
            runtime: runtime-linux-arm64-gnu
            cli: cli-linux-arm64-gnu
            llvm_asset: LLVM-22.1.8-Linux-ARM64
            llvm_dist: arm64
            use_zig: true
          - platform: windows-x64
            runner: windows-2022
            helper: llvm-win32-x64-msvc
            runtime: runtime-win32-x64-msvc
            cli: cli-win32-x64-msvc
            use_zig: true
          - platform: linux-x64-musl
            runner: ubuntu-24.04
            helper: llvm-linux-x64-musl
            runtime: runtime-linux-x64-musl
            cli: cli-linux-x64-musl
            seed_helper: llvm-linux-x64-gnu
            cli_target: x86_64-linux-musl
            llvm_asset: LLVM-22.1.8-Linux-X64
            llvm_dist: x64
            use_zig: true
          - platform: linux-arm64-musl
            runner: ubuntu-24.04-arm
            helper: llvm-linux-arm64-musl
            runtime: runtime-linux-arm64-musl
            cli: cli-linux-arm64-musl
            seed_helper: llvm-linux-arm64-gnu
            cli_target: aarch64-linux-musl
            llvm_asset: LLVM-22.1.8-Linux-ARM64
            llvm_dist: arm64
            use_zig: true
          - platform: wasm32-wasi
            runner: ubuntu-24.04
            helper: llvm-linux-x64-gnu
            runtime: runtime-wasm32-wasi
            llvm_asset: LLVM-22.1.8-Linux-X64
            llvm_dist: x64
            use_zig: true
    runs-on: ${{ matrix.runner }}
    # The Intel macOS build took 24 minutes for 0.3.2, 40 for 0.4.5, and passed 45 for 0.4.6.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.1.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: pnpm
      - name: Install toolchain (macOS)
        if: startsWith(matrix.platform, 'darwin')
        run: |
          brew install llvm@22
          llvm_prefix=$(brew --prefix llvm@22)
          echo "$llvm_prefix/bin" >> "$GITHUB_PATH"
          echo "LLVM_DIR=$llvm_prefix/lib/cmake/llvm" >> "$GITHUB_ENV"
      - name: Install pinned LLVM development distribution (Linux)
        if: startsWith(matrix.platform, 'linux') || matrix.platform == 'wasm32-wasi'
        run: |
          sudo apt-get update
          sudo apt-get install --yes g++ zlib1g-dev libzstd-dev
          curl -fL --retry 4 --retry-delay 30 -o "$RUNNER_TEMP/llvm.tar.xz" "https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.8/${{ matrix.llvm_asset }}.tar.xz"
          sh scripts/verify-toolchain.sh "$RUNNER_TEMP/llvm.tar.xz" "${{ matrix.llvm_asset }}.tar.xz"
          tar -xJf "$RUNNER_TEMP/llvm.tar.xz" -C "$RUNNER_TEMP"
          mv "$RUNNER_TEMP/${{ matrix.llvm_asset }}" "$RUNNER_TEMP/llvm-22.1.8"
          echo "LLVM_DIR=$RUNNER_TEMP/llvm-22.1.8/lib/cmake/llvm" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/llvm-22.1.8/bin" >> "$GITHUB_PATH"
      # The Linux helpers link LLVM built with ThinLTO and a profile of the
      # helper's code generation (native/llvm-codegen/llvm-dist.mjs), from a
      # release of this repository. Without that archive they link LLVM's
      # release archive, which gives the same objects more slowly. The
      # wasm32-wasi job also uploads the x64 GNU helper, so it selects the same.
      - name: Select the profiled LLVM distribution (Linux)
        if: matrix.llvm_dist != ''
        env:
          ARCH: ${{ matrix.llvm_dist }}
        run: |
          tag=$(node --input-type=module -e "import { LLVM_DIST_TAG } from './native/llvm-codegen/llvm-dist.mjs'; console.log(LLVM_DIST_TAG)")
          asset=$(node --input-type=module -e "import { llvmDistAsset } from './native/llvm-codegen/llvm-dist.mjs'; console.log(llvmDistAsset(process.env.ARCH))")
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$tag"
          if curl -fsSL --retry 3 -o "$RUNNER_TEMP/$asset" "$base/$asset" &&
            curl -fsSL --retry 3 -o "$RUNNER_TEMP/$asset.sha256" "$base/$asset.sha256" &&
            (cd "$RUNNER_TEMP" && sha256sum --check "$asset.sha256"); then
            tar -xJf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP"
            echo "SCRIPTC_HELPER_LLVM_DIR=$RUNNER_TEMP/${asset%.tar.xz}/lib/cmake/llvm" >> "$GITHUB_ENV"
            echo "The helper links $asset from release $tag"
          else
            echo "::warning::$asset is not available from release $tag; the helper links LLVM's release archive"
          fi
      - uses: vercel-labs/setup-zig@83c1594f26b86da8a9a8ddd9b5ee5f3af0f96943 # v1.0.2
        if: matrix.use_zig == true
        with:
          version: 0.16.0
      # The archive is checked against its pinned digest (scripts/toolchain.sha256) before anything unpacks it.
      - name: Download pinned LLVM development distribution (Windows)
        if: matrix.platform == 'windows-x64'
        shell: bash
        run: |
          archive="$RUNNER_TEMP/clang+llvm-22.1.8-x86_64-pc-windows-msvc.tar.xz"
          curl -fL --retry 4 --retry-delay 30 -o "$archive" https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.8/clang%2Bllvm-22.1.8-x86_64-pc-windows-msvc.tar.xz
          sh scripts/verify-toolchain.sh "$archive"
      - name: Install pinned LLVM development distribution (Windows)
        if: matrix.platform == 'windows-x64'
        shell: pwsh
        run: |
          # The complete archive supplies LLVM's exported CMake targets and
          # static libraries. windows-2022 includes CMake, Ninja, VS 2022,
          # and 7-Zip; unlike tar.exe, 7-Zip expands this archive quickly.
          $archive = "$env:RUNNER_TEMP\clang+llvm-22.1.8-x86_64-pc-windows-msvc.tar.xz"
          $llvm = "$env:RUNNER_TEMP\llvm-22.1.8"
          $expanded = "$env:RUNNER_TEMP\llvm-expanded"
          $sevenZip = "$env:ProgramFiles\7-Zip\7z.exe"
          if (-not (Test-Path $sevenZip)) {
            choco install 7zip --no-progress -y
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          if (-not (Test-Path $sevenZip)) { throw "7-Zip is unavailable" }
          & $sevenZip x -y "-o$expanded" $archive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $sevenZip x -y "-o$expanded" "$expanded\clang+llvm-22.1.8-x86_64-pc-windows-msvc.tar"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Move-Item "$expanded\clang+llvm-22.1.8-x86_64-pc-windows-msvc" $llvm
          echo "LLVM_DIR=$llvm\lib\cmake\llvm" >> $env:GITHUB_ENV
          echo "$llvm\bin" >> $env:GITHUB_PATH
      # A musl CLI ships tsc-ts's musl executable, and these jobs run on glibc
      # runners, where pnpm installs only the glibc platform packages.
      - name: Let pnpm install musl platform packages
        if: endsWith(matrix.cli_target, '-musl')
        run: |
          printf 'supportedArchitectures:\n  libc: [current, musl]\n' >> pnpm-workspace.yaml
      - run: pnpm install --frozen-lockfile
      - name: Build native packages (POSIX)
        if: matrix.platform != 'windows-x64'
        run: |
          if [ -n "${SCRIPTC_HELPER_LLVM_DIR:-}" ]; then
            LLVM_DIR="$SCRIPTC_HELPER_LLVM_DIR" SCRIPTC_LLVM_THINLTO=1 pnpm --filter @scriptc/${{ matrix.helper }} build:native || {
              echo "::warning::the helper did not build against the profiled LLVM; it links LLVM's release archive"
              rm -rf node_modules/.cache/scriptc-${{ matrix.helper }}
              pnpm --filter @scriptc/${{ matrix.helper }} build:native
            }
          else
            pnpm --filter @scriptc/${{ matrix.helper }} build:native
          fi
          if [ "${{ matrix.use_zig }}" = true ]; then
            CC=zig AR=zig pnpm --filter @scriptc/${{ matrix.runtime }} build:native
          else
            CC=clang AR=llvm-ar pnpm --filter @scriptc/${{ matrix.runtime }} build:native
          fi
      - name: Build native packages (Windows)
        if: matrix.platform == 'windows-x64'
        run: |
          pnpm --filter @scriptc/${{ matrix.helper }} build:native
          pnpm --filter @scriptc/${{ matrix.runtime }} build:native
      - name: Build host helper for cross-libc bootstrap
        if: matrix.seed_helper != ''
        run: pnpm --filter @scriptc/${{ matrix.seed_helper }} build:native
      - name: Download the profile collected on this commit
        id: cli-profile
        if: matrix.cli != '' && inputs.collected-profile
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cli-profile
          path: ${{ runner.temp }}/cli-profile
      # Without the artifact, SCRIPTC_NATIVE_PROFILE_USE and SCRIPTC_NATIVE_LAYOUT
      # stay unset and build-native-cli.mts uses the committed profile and layout.
      - name: Select the native compiler profile
        if: matrix.cli != ''
        shell: bash
        env:
          COLLECTED: ${{ steps.cli-profile.outcome == 'success' && format('{0}/cli-profile/cli.profdata.gz', runner.temp) || '' }}
          COLLECTED_PROFILE: ${{ inputs.collected-profile }}
        run: |
          if [ -n "$COLLECTED" ]; then
            echo "SCRIPTC_NATIVE_PROFILE_USE=$COLLECTED" >> "$GITHUB_ENV"
            echo "The native CLI builds with the profile collected on $GITHUB_SHA"
            layout="$(dirname "$COLLECTED")/cli.layout.gz"
            if [ -f "$layout" ]; then
              echo "SCRIPTC_NATIVE_LAYOUT=$layout" >> "$GITHUB_ENV"
              echo "The native CLI builds with the function layout collected on $GITHUB_SHA"
            fi
          elif [ "$COLLECTED_PROFILE" = true ]; then
            echo "::warning::No profile was collected on this commit; the native CLI builds with the committed profile"
          else
            echo "The native CLI builds with the committed profile"
          fi
      - name: Build native CLI distribution
        if: matrix.cli != ''
        env:
          SCRIPTC_TARGET: ${{ matrix.cli_target }}
        run: |
          pnpm --filter @scriptc/compiler --filter scriptc build
          pnpm --filter @scriptc/${{ matrix.cli }} build:native
          node scripts/verify-native-cli.mjs packages/${{ matrix.cli }} --run
      - name: Verify GNU npm distribution on glibc 2.34
        if: matrix.platform == 'linux-x64' || matrix.platform == 'linux-arm64'
        run: |
          NODE_ROOT=$(dirname "$(dirname "$(command -v node)")")
          docker run --rm --volume "$GITHUB_WORKSPACE:/work:ro" --volume "$NODE_ROOT:/node:ro" \
            --env PATH=/node/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin \
            --workdir /work amazonlinux:2023 sh -c '
              set -eu
              dnf install --assumeyes clang tar gzip
              test "$(getconf GNU_LIBC_VERSION)" = "glibc 2.34"
              node scripts/smoke-native-install.mjs packages/${{ matrix.cli }}
            '
      - name: Verify packed Darwin helper on its build host
        if: matrix.platform == 'darwin-arm64'
        run: |
          TARBALL=$(pnpm --dir packages/llvm-darwin-arm64 pack --pack-destination "$RUNNER_TEMP" --silent)
          node scripts/verify-llvm-package.mjs "$RUNNER_TEMP/$(basename "$TARBALL")"
      - name: Upload native packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-${{ matrix.platform }}
          path: |
            packages/${{ matrix.helper }}
            packages/${{ matrix.runtime }}
            ${{ matrix.cli != '' && format('packages/{0}/dist', matrix.cli) || '' }}
          retention-days: 7

  mobile:
    name: Build ${{ matrix.runtime }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: runtime-ios-arm64
            runner: macos-15
          - runtime: runtime-ios-simulator-arm64
            runner: macos-15
          - runtime: runtime-android-arm64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/mobile-runtime-pack
        with:
          runtime: ${{ matrix.runtime }}
      - name: Stage mobile runtime pack
        run: |
          mkdir -p "$RUNNER_TEMP/mobile-pack/${{ matrix.runtime }}"
          cp -R packages/${{ matrix.runtime }}/. "$RUNNER_TEMP/mobile-pack/${{ matrix.runtime }}/"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-${{ matrix.runtime }}
          path: ${{ runner.temp }}/mobile-pack
          retention-days: 7
