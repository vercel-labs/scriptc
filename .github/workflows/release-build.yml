name: Release build

# Builds every native package a release publishes: the LLVM helper, runtime
# pack and native CLI of each platform on its matching host, and the mobile
# runtime packs. Each uploads as a native-<platform> artifact of the calling
# run. Nothing here publishes.
#
# Two workflows call it, so the release and its rehearsal build exactly the
# same way:
# - release.yml, before it publishes;
# - release-dry-run.yml, on the newest green main commit (postmerge.yml) and
#   on pull requests that prepare a release or change how it builds, so a
#   package that no longer builds shows up before a release run instead of in
#   it.
#
# Only the native CLIs use the compiler profile. The helpers and runtime packs
# (packs), the mobile packs, and the caller's libnode packs build while
# cli-layout and cli-profile collect it, and each platform's CLI job (cli) starts from its
# packs once the profile is ready, so the profile's hour and a half is no
# longer added to every platform's build.

on:
  workflow_call:
    inputs:
      collect-profile:
        description: >-
          Collect the native compiler profile and layout on this commit (two jobs, about 45 and 100 minutes) and build the
          native CLIs with them. Without it they build with the committed profile and layout, which is also what a
          release build falls back to when the collection fails.
        type: boolean
        default: false
      ref:
        description: The commit to build. Empty builds the caller's commit; every checkout reads it.
        type: string
        default: ""

permissions:
  contents: read

jobs:
  # The platforms, from .github/release-platforms.json, for the packs and cli
  # matrices.
  plan:
    name: Plan the platform builds
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      platforms: ${{ steps.platforms.outputs.platforms }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}
      - id: platforms
        run: echo "platforms=$(jq -c . .github/release-platforms.json)" >> "$GITHUB_OUTPUT"

  # Collects the native compiler's function layout on this commit
  # (scripts/refresh-cli-layout.mjs), then its profile with that layout
  # (scripts/refresh-cli-profile.mjs), so every platform's CLI build optimizes
  # and lays out the code it compiles. The committed ones fall behind main
  # within a day or two. Three instrumented compiler builds and their training
  # do not fit one job's 120-minute limit, so the layout is collected here and
  # the profile in the job below, which takes the layout through an artifact.
  # If either job fails, the CLI builds use the committed profile and layout.
  cli-layout:
    name: Collect the native compiler layout
    if: inputs.collect-profile
    runs-on: ubuntu-24.04
    # One instrumented build and its training: about 45 minutes.
    timeout-minutes: 60
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.1.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: pnpm
      - uses: ./.github/actions/llvm-linux
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/zig
      - uses: ./.github/actions/native-packages
        with:
          target: linux-x64-gnu
      - run: pnpm --filter @scriptc/compiler --filter scriptc build
      - name: Check out tsc-ts
        run: |
          git clone --quiet --depth 1 https://github.com/vercel-labs/tsc-ts "$RUNNER_TEMP/tsc-ts"
          echo "tsc-ts $(git -C "$RUNNER_TEMP/tsc-ts" rev-parse HEAD)"
          npm ci --prefix "$RUNNER_TEMP/tsc-ts"
      - name: Collect the function layout
        run: >-
          node scripts/refresh-cli-layout.mjs --jobs 4
          --output "$RUNNER_TEMP/cli-layout/cli.layout.gz" --work "$RUNNER_TEMP/cli-layout-work"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cli-layout
          path: ${{ runner.temp }}/cli-layout/cli.layout.gz
          retention-days: 7
          if-no-files-found: error

  # The profile matches the functions of builds with the layout its
  # instrumented compiler was built with, so it is collected with a second
  # instrumented compiler built with the layout the job above collects.
  cli-profile:
    name: Collect the native compiler profile
    needs: cli-layout
    if: ${{ inputs.collect-profile && !cancelled() }}
    runs-on: ubuntu-24.04
    # The instrumented build, the first phase's training, the context-sensitive
    # instrumented build and its training: about 100 minutes.
    timeout-minutes: 150
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.1.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: pnpm
      - uses: ./.github/actions/llvm-linux
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/zig
      - uses: ./.github/actions/native-packages
        with:
          target: linux-x64-gnu
      - run: pnpm --filter @scriptc/compiler --filter scriptc build
      - name: Check out tsc-ts
        run: |
          git clone --quiet --depth 1 https://github.com/vercel-labs/tsc-ts "$RUNNER_TEMP/tsc-ts"
          echo "tsc-ts $(git -C "$RUNNER_TEMP/tsc-ts" rev-parse HEAD)"
          npm ci --prefix "$RUNNER_TEMP/tsc-ts"
      # A layout that could not be collected leaves this step empty and the
      # profile step fails, which the job's continue-on-error tolerates.
      - name: Take the function layout
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cli-layout
          path: ${{ runner.temp }}/cli-profile
      - name: Collect the profile
        env:
          SCRIPTC_NATIVE_LAYOUT: ${{ runner.temp }}/cli-profile/cli.layout.gz
        run: >-
          node scripts/refresh-cli-profile.mjs --tsc-ts "$RUNNER_TEMP/tsc-ts" --jobs 4 --context-sensitive
          --output "$RUNNER_TEMP/cli-profile/cli.profdata.gz" --work "$RUNNER_TEMP/cli-profile-work"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cli-profile
          path: |
            ${{ runner.temp }}/cli-profile/cli.profdata.gz
            ${{ runner.temp }}/cli-profile/cli.layout.gz
          retention-days: 7
          if-no-files-found: error

  # Each platform's LLVM helper and runtime pack, which do not use the
  # compiler profile. They upload as packs-<platform> (a tarball, which keeps
  # the executables' modes) for that platform's cli job.
  packs:
    name: Build helper and runtime pack (${{ matrix.platform }})
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.platforms) }}
    runs-on: ${{ matrix.runner }}
    # The Intel macOS helper and pack take the longest.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.1.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: pnpm
      - uses: ./.github/actions/release-toolchain
        with:
          platform: ${{ matrix.platform }}
          llvm-asset: ${{ matrix.llvm_asset }}
          use-zig: ${{ matrix.use_zig }}
      # The Linux helpers link LLVM built with ThinLTO and a profile of the
      # helper's code generation (native/llvm-codegen/llvm-dist.mjs), from a
      # release of this repository. Without that archive they link LLVM's
      # release archive, which gives the same objects more slowly. The
      # wasm32-wasi job also uploads the x64 GNU helper, so it selects the same.
      - name: Select the profiled LLVM distribution (Linux)
        if: matrix.llvm_dist != ''
        env:
          ARCH: ${{ matrix.llvm_dist }}
        run: |
          tag=$(node --input-type=module -e "import { LLVM_DIST_TAG } from './native/llvm-codegen/llvm-dist.mjs'; console.log(LLVM_DIST_TAG)")
          asset=$(node --input-type=module -e "import { llvmDistAsset } from './native/llvm-codegen/llvm-dist.mjs'; console.log(llvmDistAsset(process.env.ARCH))")
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$tag"
          if curl -fsSL --retry 3 -o "$RUNNER_TEMP/$asset" "$base/$asset" &&
            curl -fsSL --retry 3 -o "$RUNNER_TEMP/$asset.sha256" "$base/$asset.sha256" &&
            (cd "$RUNNER_TEMP" && sha256sum --check "$asset.sha256"); then
            tar -xJf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP"
            echo "SCRIPTC_HELPER_LLVM_DIR=$RUNNER_TEMP/${asset%.tar.xz}/lib/cmake/llvm" >> "$GITHUB_ENV"
            echo "The helper links $asset from release $tag"
          else
            echo "::warning::$asset is not available from release $tag; the helper links LLVM's release archive"
          fi
      # A musl CLI ships tsc-ts's musl executable, and these jobs run on glibc
      # runners, where pnpm installs only the glibc platform packages.
      - name: Let pnpm install musl platform packages
        if: endsWith(matrix.cli_target, '-musl')
        run: |
          printf 'supportedArchitectures:\n  libc: [current, musl]\n' >> pnpm-workspace.yaml
      - run: pnpm install --frozen-lockfile
      - name: Build native packages (POSIX)
        if: matrix.platform != 'windows-x64'
        run: |
          if [ -n "${SCRIPTC_HELPER_LLVM_DIR:-}" ]; then
            LLVM_DIR="$SCRIPTC_HELPER_LLVM_DIR" SCRIPTC_LLVM_THINLTO=1 pnpm --filter @scriptc/${{ matrix.helper }} build:native || {
              echo "::warning::the helper did not build against the profiled LLVM; it links LLVM's release archive"
              rm -rf node_modules/.cache/scriptc-${{ matrix.helper }}
              pnpm --filter @scriptc/${{ matrix.helper }} build:native
            }
          else
            pnpm --filter @scriptc/${{ matrix.helper }} build:native
          fi
          if [ "${{ matrix.use_zig }}" = true ]; then
            CC=zig AR=zig pnpm --filter @scriptc/${{ matrix.runtime }} build:native
          else
            CC=clang AR=llvm-ar pnpm --filter @scriptc/${{ matrix.runtime }} build:native
          fi
      - name: Build native packages (Windows)
        if: matrix.platform == 'windows-x64'
        run: |
          pnpm --filter @scriptc/${{ matrix.helper }} build:native
          pnpm --filter @scriptc/${{ matrix.runtime }} build:native
      - name: Build host helper for cross-libc bootstrap
        if: matrix.seed_helper != ''
        run: pnpm --filter @scriptc/${{ matrix.seed_helper }} build:native
      # The archive is written inside the checkout, by a relative path: GNU tar
      # (Git Bash's, on Windows) reads an archive name with a colon, such as
      # D:\a\_temp\packs.tar.gz, as host:path and tries to reach host "D".
      # (No leading dot: upload-artifact leaves hidden files out.)
      - name: Archive the helper and runtime pack
        shell: bash
        run: >-
          tar -czf release-packs.tar.gz
          packages/${{ matrix.helper }} packages/${{ matrix.runtime }}
          ${{ matrix.seed_helper != '' && format('packages/{0}', matrix.seed_helper) || '' }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: packs-${{ matrix.platform }}
          path: release-packs.tar.gz
          retention-days: 1
          if-no-files-found: error

  # Each platform's native CLI, built on its packs with the profile collected
  # on this commit, and the native-<platform> artifact the release publishes:
  # the same steps, in the same order, on the same files as when one job built
  # the packs and the CLI.
  cli:
    name: Build native package (${{ matrix.platform }})
    needs: [plan, packs, cli-profile]
    # Runs when the profile job fails or is skipped; the CLI builds then use
    # the committed profile. A platform whose packs failed fails here when its
    # packs artifact is missing.
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.platforms) }}
    runs-on: ${{ matrix.runner }}
    # The optimized native CLI takes most of a platform's build: 56-63
    # minutes on darwin-x64, and from 68 to over 90 on darwin-arm64, whose
    # runner has 7 GB of memory and swaps for most of it.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.1.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: pnpm
      - uses: ./.github/actions/release-toolchain
        with:
          platform: ${{ matrix.platform }}
          llvm-asset: ${{ matrix.llvm_asset }}
          use-zig: ${{ matrix.use_zig }}
      # A musl CLI ships tsc-ts's musl executable, and these jobs run on glibc
      # runners, where pnpm installs only the glibc platform packages.
      - name: Let pnpm install musl platform packages
        if: endsWith(matrix.cli_target, '-musl')
        run: |
          printf 'supportedArchitectures:\n  libc: [current, musl]\n' >> pnpm-workspace.yaml
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: packs-${{ matrix.platform }}
      # Read by a relative path for the same reason as in packs, and removed so
      # nothing else in the checkout changes.
      - name: Restore the helper and runtime pack
        shell: bash
        run: |
          tar -xzf release-packs.tar.gz
          rm release-packs.tar.gz
      - name: Download the profile collected on this commit
        id: cli-profile
        if: matrix.cli != '' && inputs.collect-profile
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cli-profile
          path: ${{ runner.temp }}/cli-profile
      # Without the artifact, SCRIPTC_NATIVE_PROFILE_USE and SCRIPTC_NATIVE_LAYOUT
      # stay unset and build-native-cli.mts uses the committed profile and layout.
      - name: Select the native compiler profile
        if: matrix.cli != ''
        shell: bash
        env:
          COLLECTED: ${{ steps.cli-profile.outcome == 'success' && format('{0}/cli-profile/cli.profdata.gz', runner.temp) || '' }}
          COLLECTED_PROFILE: ${{ inputs.collect-profile }}
        run: |
          if [ -n "$COLLECTED" ]; then
            echo "SCRIPTC_NATIVE_PROFILE_USE=$COLLECTED" >> "$GITHUB_ENV"
            echo "The native CLI builds with the profile collected on $(git rev-parse HEAD)"
            layout="$(dirname "$COLLECTED")/cli.layout.gz"
            if [ -f "$layout" ]; then
              echo "SCRIPTC_NATIVE_LAYOUT=$layout" >> "$GITHUB_ENV"
              echo "The native CLI builds with the function layout collected on $(git rev-parse HEAD)"
            fi
          elif [ "$COLLECTED_PROFILE" = true ]; then
            echo "::warning::No profile was collected on this commit; the native CLI builds with the committed profile"
          else
            echo "The native CLI builds with the committed profile"
          fi
      - name: Build native CLI distribution
        if: matrix.cli != ''
        env:
          SCRIPTC_TARGET: ${{ matrix.cli_target }}
        run: |
          pnpm --filter @scriptc/compiler --filter scriptc build
          pnpm --filter @scriptc/${{ matrix.cli }} build:native
          node scripts/verify-native-cli.mjs packages/${{ matrix.cli }} --run
      - name: Verify GNU npm distribution on glibc 2.34
        if: matrix.platform == 'linux-x64' || matrix.platform == 'linux-arm64'
        run: |
          NODE_ROOT=$(dirname "$(dirname "$(command -v node)")")
          docker run --rm --volume "$GITHUB_WORKSPACE:/work:ro" --volume "$NODE_ROOT:/node:ro" \
            --env PATH=/node/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin \
            --workdir /work amazonlinux:2023 sh -c '
              set -eu
              dnf install --assumeyes clang tar gzip
              test "$(getconf GNU_LIBC_VERSION)" = "glibc 2.34"
              node scripts/smoke-native-install.mjs packages/${{ matrix.cli }}
            '
      - name: Verify packed Darwin helper on its build host
        if: matrix.platform == 'darwin-arm64'
        run: |
          TARBALL=$(pnpm --dir packages/llvm-darwin-arm64 pack --pack-destination "$RUNNER_TEMP" --silent)
          node scripts/verify-llvm-package.mjs "$RUNNER_TEMP/$(basename "$TARBALL")"
      - name: Upload native packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-${{ matrix.platform }}
          path: |
            packages/${{ matrix.helper }}
            packages/${{ matrix.runtime }}
            ${{ matrix.cli != '' && format('packages/{0}/dist', matrix.cli) || '' }}
          retention-days: 7

  mobile:
    name: Build ${{ matrix.runtime }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: runtime-ios-arm64
            runner: macos-15
          - runtime: runtime-ios-simulator-arm64
            runner: macos-15
          - runtime: runtime-android-arm64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/mobile-runtime-pack
        with:
          runtime: ${{ matrix.runtime }}
      - name: Stage mobile runtime pack
        run: |
          mkdir -p "$RUNNER_TEMP/mobile-pack/${{ matrix.runtime }}"
          cp -R packages/${{ matrix.runtime }}/. "$RUNNER_TEMP/mobile-pack/${{ matrix.runtime }}/"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-${{ matrix.runtime }}
          path: ${{ runner.temp }}/mobile-pack
          retention-days: 7
