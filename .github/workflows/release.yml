name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      require_green_ci:
        description: Publish only when the CI run on this commit succeeded
        type: boolean
        default: true

# No workflow-wide concurrency group. One used to serialize every run, so a run
# left waiting for the Release environment's approval blocked every later run
# without saying so. Instead, each run's supersede job cancels older runs that
# have not started publishing, and the publish job keeps its own group, so two
# runs never upload at once.

# The token of a job that declares no permissions of its own (the native and mobile package builds) can read the
# repository and nothing else. The jobs that read other runs' artifacts, publish to npm or write the GitHub release
# declare what they need.
permissions:
  contents: read

jobs:
  # Cancels older runs of this branch that are still building or waiting for
  # approval to publish (scripts/release-supersede.mjs); this run releases the
  # same or a later commit. A run that has started publishing is left to finish.
  supersede:
    name: Supersede older release runs
    if: github.repository == 'vercel-labs/scriptc'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # A failure here must not stop the release; the publish group still keeps
    # two uploads apart.
    continue-on-error: true
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: Cancel stale release runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release-supersede.mjs

  check-release:
    name: Check for new version
    # Releases publish from main only: canary is the integration branch, and a
    # manual dispatch on canary must not publish. Every later job needs this
    # job's outputs, so a run on another ref builds and publishes nothing.
    # The private mirror carries this file too; only the public repo
    # publishes (the trusted publisher is pinned to it).
    if: github.repository == 'vercel-labs/scriptc' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
      artifact_run: ${{ steps.reuse.outputs.artifact_run || github.run_id }}
      reuse_artifacts: ${{ steps.reuse.outputs.artifact_run != '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Check GitHub release completion
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LOCAL_VERSION=$(node -p "require('./packages/cli/package.json').version")
          echo "Local version: $LOCAL_VERSION"
          RELEASE_DRAFT=$(gh release view "v$LOCAL_VERSION" --json isDraft --jq .isDraft 2>/dev/null || echo missing)
          if [ "$RELEASE_DRAFT" = false ]; then
            echo "Release is complete"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Release needs publishing or completion"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$LOCAL_VERSION" >> "$GITHUB_OUTPUT"

      # What would otherwise fail only after the builds: package versions out
      # of sync (the publish job's check), no marked changelog entry (the
      # GitHub release's body) and a stale surface manifest (its asset). And a
      # version npm already has any package of: a release never reuses a
      # version, so a run that published part of one and failed is followed by
      # the next patch (scripts/release-preflight.mjs --npm, #4011).
      - name: Check the release can publish
        if: steps.check.outputs.should_release == 'true'
        run: node scripts/release-preflight.mjs --npm
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        if: steps.check.outputs.should_release == 'true'
        with:
          version: 11.1.3
      - name: Check the surface manifest
        if: steps.check.outputs.should_release == 'true'
        run: |
          pnpm install --frozen-lockfile
          if ! pnpm manifest --check; then
            echo "::error::packages/compiler/surface-manifest.json does not match the tree. Run 'pnpm manifest' and commit; the GitHub release attaches this file."
            exit 1
          fi

      - name: Find reusable builds
        id: reuse
        if: steps.check.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync, spawnSync } from 'node:child_process';
          import { appendFileSync } from 'node:fs';
          const api = (path) => JSON.parse(execFileSync('gh', ['api', path], { encoding: 'utf8', maxBuffer: 8 * 1024 * 1024 }));
          const repo = process.env.GITHUB_REPOSITORY;
          // Every payload the release publishes from a build artifact: the
          // platform helper/runtime/CLI packages and the four libnode packs
          // (libnode-packs job, named libnode-<platform>).
          const expected = [
            'darwin-arm64', 'darwin-x64', 'linux-x64', 'linux-arm64',
            'linux-x64-musl', 'linux-arm64-musl', 'windows-x64', 'wasm32-wasi',
            'runtime-ios-arm64', 'runtime-ios-simulator-arm64', 'runtime-android-arm64',
          ].map((platform) => `native-${platform}`).concat([
            'libnode-linux-x64-gnu', 'libnode-linux-arm64-gnu',
            'libnode-darwin-arm64', 'libnode-darwin-x64',
          ]);
          const runs = api(`repos/${repo}/actions/workflows/release.yml/runs?branch=main&status=completed&per_page=100`).workflow_runs;
          let artifactRun;
          for (const run of runs) {
            if (String(run.id) === process.env.GITHUB_RUN_ID || run.head_branch !== 'main' ||
                run.head_repository?.full_name !== repo || !['push', 'workflow_dispatch'].includes(run.event)) continue;
            // Release orchestration, packaging validation, and their tests do
            // not change the compiled payloads in native build artifacts.
            if (spawnSync('git', ['merge-base', '--is-ancestor', run.head_sha, 'HEAD']).status !== 0 ||
                spawnSync('git', ['diff', '--quiet', run.head_sha, 'HEAD', '--', '.',
                  ':(exclude).github/workflows/release.yml', ':(exclude)scripts/verify-native-cli.mjs',
                  ':(exclude)scripts/package-native-cli.mjs', ':(exclude)tests/harness/native-cli-packaging.test.ts',
                  ':(exclude)scripts/wait-npm-available.mjs', ':(exclude)tests/harness/npm-available.test.ts',
                  ':(exclude)scripts/release-supersede.mjs', ':(exclude)scripts/release-preflight.mjs',
                  ':(exclude)scripts/release-ci-gate.mjs',
                  ':(exclude)scripts/verify-npm-published.mjs', ':(exclude)scripts/release-registry-smoke.mjs',
                  ':(exclude)tests/harness/release-guards.test.ts',
                ]).status !== 0) continue;
            const artifacts = api(`repos/${repo}/actions/runs/${run.id}/artifacts?per_page=100`).artifacts
              .filter((artifact) => !artifact.expired && artifact.size_in_bytes > 0);
            if (!artifactRun && expected.every((name) => artifacts.filter((artifact) => artifact.name === name).length === 1)) {
              artifactRun = run.id;
              console.log(`Reusing native builds from run ${run.id} (${run.head_sha})`);
            }
            if (artifactRun) break;
          }
          if (artifactRun) appendFileSync(process.env.GITHUB_OUTPUT, `artifact_run=${artifactRun}\n`);
          NODE

  # Every native package and mobile runtime pack, each on its matching host,
  # and the native compiler profile their CLIs build with (release-build.yml). release-dry-run.yml runs the same workflow nightly
  # and on release-prep pull requests, without publishing.
  build-native-packages:
    name: Build native packages
    needs: check-release
    if: needs.check-release.outputs.should_release == 'true' && needs.check-release.outputs.reuse_artifacts != 'true'
    uses: ./.github/workflows/release-build.yml
    with:
      # Collects the native compiler's profile and layout on this commit, so
      # every platform's CLI build optimizes and lays out the code it
      # compiles (release-build.yml's cli-profile job).
      collect-profile: true


  # The four @scriptc/libnode-<platform> packs ship with the release as
  # opt-in packages: scriptc does not depend on them, and a program that
  # calls into Node.js installs its host's pack. libnode-packs builds and
  # smoke-tests each one (it is also its own workflow, so a pin or bridge
  # change can rebuild them without a release).
  build-libnode-packs:
    name: Build libnode packs
    needs: check-release
    if: needs.check-release.outputs.should_release == 'true' && needs.check-release.outputs.reuse_artifacts != 'true'
    uses: ./.github/workflows/libnode-packs.yml

  # Releases require a green CI run on their commit. This waits for the CI
  # run on this commit beside the builds, and fails with its link when it did
  # not succeed, before anyone is asked to approve the upload. CI on main keeps
  # only the newest pending push run, so when this commit's run was dropped,
  # scripts/release-ci-gate.mjs dispatches a complete CI run on it and waits
  # for that.
  ci-green:
    name: Require green CI on this commit
    needs: check-release
    if: >-
      needs.check-release.outputs.should_release == 'true' &&
      (github.event_name != 'workflow_dispatch' || inputs.require_green_ci)
    runs-on: ubuntu-latest
    # CI on main takes about 75 minutes; a dispatched run, with the complete
    # macOS suite, about two and a half hours.
    timeout-minutes: 240
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: Wait for CI on ${{ github.sha }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release-ci-gate.mjs

  publish:
    name: Publish to npm
    needs: [check-release, build-native-packages, build-libnode-packs, ci-green]
    # Two runs never upload at once. A newer run's publish waits here for an
    # older one that has started; supersede cancels older runs that have not.
    concurrency:
      group: release-publish-${{ github.ref }}
      cancel-in-progress: false
    if: >-
      !cancelled() && needs.check-release.outputs.should_release == 'true' &&
      (needs.ci-green.result == 'success' || needs.ci-green.result == 'skipped') &&
      (needs.check-release.outputs.reuse_artifacts == 'true' ||
      (needs.build-native-packages.result == 'success' && needs.build-libnode-packs.result == 'success'))
    runs-on: ubuntu-latest
    # Two waits for npm availability of at most 50 minutes each: npm can take
    # more than 25 minutes to serve the largest runtime packs.
    timeout-minutes: 120
    environment: Release
    permissions:
      contents: read
      actions: read
      id-token: write
    outputs:
      uploads: ${{ steps.publish.outputs.uploads }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Download native packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: native-*
          path: native-artifacts
          merge-multiple: true
          run-id: ${{ needs.check-release.outputs.artifact_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # One artifact per pack, each holding the contents of its package
      # directory. Downloaded one directory per artifact (no merge) so the
      # four packs keep their own files, and the packs' compressed-library
      # artifacts (libnode-<platform>-zst) stay out of the packages.
      - name: Download libnode packs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: libnode-*
          path: libnode-artifacts
          run-id: ${{ needs.check-release.outputs.artifact_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore accepted upload receipts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.check-release.outputs.version }}
        run: |
          touch "$RUNNER_TEMP/npm-accepted.txt" "$RUNNER_TEMP/npm-accepted-times.txt"
          # Re-running this run's failed jobs restores its receipts. No other
          # run's: a new run of a version npm already has stops at preflight.
          for run in "$GITHUB_RUN_ID"; do
            if [ -z "$run" ]; then continue; fi
            count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts?per_page=100" \
              --jq "[.artifacts[] | select(.expired == false and (.name | startswith(\"npm-accepted-$VERSION-\")))] | length")
            if [ "$count" -eq 0 ]; then continue; fi
            gh run download "$run" --repo "$GITHUB_REPOSITORY" --pattern "npm-accepted-$VERSION-*" --dir "$RUNNER_TEMP/npm-receipts/$run"
            find "$RUNNER_TEMP/npm-receipts/$run" -name npm-accepted.txt -exec cat {} + >> "$RUNNER_TEMP/npm-accepted.txt"
            find "$RUNNER_TEMP/npm-receipts/$run" -name npm-accepted-times.txt -exec cat {} + >> "$RUNNER_TEMP/npm-accepted-times.txt"
          done

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.1.3

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # Publishing uses npm trusted publishing (OIDC): the job's id-token
      # permission lets npm mint short-lived credentials, so no npm token
      # secret exists anywhere in this repo. The runtime, every shipped
      # platform runtime/helper package, compiler, and CLI must each be
      # configured on npmjs.com with a GitHub Actions trusted publisher
      # pointing at repository vercel-labs/scriptc, workflow release.yml,
      # environment Release. A package missing that configuration fails
      # with an OIDC authentication error before anything uploads.
      # Trusted publishing requires npm >= 11.5.1 (bundled with Node 24).

      - name: Install and build
        run: |
          pnpm install --frozen-lockfile
          cp -R native-artifacts/. packages/
          # The packs publish from their package directories, beside the
          # package.json that lists the files they carry.
          for platform in linux-x64-gnu linux-arm64-gnu darwin-arm64 darwin-x64; do
            test -f "libnode-artifacts/libnode-$platform/manifest.json"
            cp -R "libnode-artifacts/libnode-$platform/." "packages/libnode-$platform/"
          done
          # upload-artifact does not preserve executable bits. Restore the
          # helper and evaluator modes before pnpm runs its prepack checks.
          find packages -type f \( -path '*/bin/scriptc-llvm-codegen' -o -path '*/bin/scriptc-comptime' \) -exec chmod 755 {} +
          find packages -type f \( -path '*/dist/bin/scriptc' -o -path '*/dist/lib/typescript/lib/tsc' \) -exec chmod 755 {} +
          pnpm -r build

      - name: Check version sync
        run: |
          VERSION="${{ needs.check-release.outputs.version }}"
          for pkg in packages/runtime packages/runtime-* packages/llvm-* packages/compiler packages/experimental packages/node packages/threads packages/types packages/cli packages/cli-* packages/libnode-*; do
            if [ "$(node -p "require('./$pkg/package.json').private === true")" = "true" ]; then
              continue
            fi
            V=$(node -p "require('./$pkg/package.json').version")
            if [ "$V" != "$VERSION" ]; then
              echo "Version mismatch: $pkg is $V, expected $VERSION"
              echo "Run 'node scripts/sync-versions.mjs' to stamp runtime and compiler from the CLI version, then commit"
              exit 1
            fi
          done

      - name: Publish to npm
        id: publish
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.check-release.outputs.version }}
        run: |
          # npm accepts --provenance only from PUBLIC source repositories;
          # while this repo is internal the flag is dropped, and the same
          # step starts attaching provenance the moment the repo goes
          # public — no workflow edit.
          VISIBILITY=$(gh api "repos/${{ github.repository }}" --jq .visibility)
          if [ "$VISIBILITY" = "public" ]; then
            PROVENANCE="--provenance"
          else
            PROVENANCE=""
            echo "repository visibility is '$VISIBILITY': publishing without provenance"
          fi

          # Upload acceptance and public availability are separate states.
          # Save acceptance immediately so retries never depend on registry lag.
          # npm-release.txt lists every package of the release, and
          # npm-accepted-times.txt the time npm accepted each upload, for the
          # npm-available job.
          publish_dir() {
            dir="$1"
            packed="${2:-}"
            name=$(node -p "require('./$dir/package.json').name")
            echo "$name@$VERSION" >> "$RUNNER_TEMP/npm-release.txt"
            if grep -Fxq "$name@$VERSION" "$RUNNER_TEMP/npm-accepted.txt"; then
              echo "$name@$VERSION upload already accepted, skipping"
              return 0
            fi
            if [ -z "$packed" ]; then
              tarball=$(cd "$dir" && pnpm pack --silent | tail -1)
              packed="$dir/$tarball"
            fi
            case "$dir" in
              packages/llvm-darwin-*|packages/llvm-linux-*)
                node scripts/verify-llvm-package-mode.mjs "$packed" "$name"
                ;;
            esac
            publish_log="$RUNNER_TEMP/npm-publish.log"
            # Under the next dist-tag: latest moves only once the release
            # installs, builds and runs from npm on every host (promote).
            if npm publish "$packed" $PROVENANCE --access public --tag next 2>&1 | tee "$publish_log"; then
              echo "$name@$VERSION" >> "$RUNNER_TEMP/npm-accepted.txt"
              echo "$name@$VERSION $(date +%s)" >> "$RUNNER_TEMP/npm-accepted-times.txt"
              return 0
            else
              publish_status=${PIPESTATUS[0]}
            fi
            if [ "$publish_status" -eq 0 ]; then return 1; fi
            # Older runs have no receipts. This specific conflict means npm
            # already accepted this version; other publish failures still fail.
            if grep -Fq 'npm error code E409' "$publish_log" && \
                grep -Fq "Cannot publish over previously staged version \"$VERSION\"." "$publish_log"; then
              echo "$name@$VERSION is already accepted and awaiting npm processing"
              echo "$name@$VERSION" >> "$RUNNER_TEMP/npm-accepted.txt"
              return 0
            fi
            # npm refused the upload because the version exists. Versions are
            # immutable, so it counts as published only when npm holds this
            # payload: an earlier failed attempt from another commit may have
            # published it (0.4.15's runtime packs, #4011).
            if npm view "$name@$VERSION" version >/dev/null 2>&1; then
              node scripts/verify-npm-published.mjs "$packed" "$name@$VERSION" || return 1
              echo "$name@$VERSION is now public"
              echo "$name@$VERSION" >> "$RUNNER_TEMP/npm-accepted.txt"
              return 0
            fi
            return "$publish_status"
          }

          # pnpm pack resolves workspace dependencies; npm handles OIDC.
          # Publish dependencies first. The npm-available job waits for the
          # packages that nothing in this release depends on.
          publish_dir packages/runtime
          publish_dir packages/runtime-darwin-arm64
          publish_dir packages/llvm-darwin-arm64
          publish_dir packages/runtime-darwin-x64
          publish_dir packages/llvm-darwin-x64
          publish_dir packages/runtime-linux-x64-gnu
          publish_dir packages/llvm-linux-x64-gnu
          publish_dir packages/runtime-linux-arm64-gnu
          publish_dir packages/llvm-linux-arm64-gnu
          publish_dir packages/runtime-linux-x64-musl
          publish_dir packages/llvm-linux-x64-musl
          publish_dir packages/runtime-linux-arm64-musl
          publish_dir packages/llvm-linux-arm64-musl
          publish_dir packages/runtime-ios-arm64
          publish_dir packages/runtime-ios-simulator-arm64
          publish_dir packages/runtime-android-arm64
          publish_dir packages/runtime-wasm32-wasi
          publish_dir packages/runtime-win32-x64-msvc
          publish_dir packages/llvm-win32-x64-msvc
          # The libnode packs are opt-in: nothing in this release depends on
          # them, and a program that calls into Node.js installs its host's
          # pack, so they publish with the platform payload above.
          publish_dir packages/libnode-darwin-arm64
          publish_dir packages/libnode-darwin-x64
          publish_dir packages/libnode-linux-x64-gnu
          publish_dir packages/libnode-linux-arm64-gnu
          # A native CLI package depends on its platform's LLVM helper and
          # runtime pack packages, and scriptc on the native CLI packages.
          # Each group publishes only once the packages it depends on
          # resolve, so an install never finds a package whose dependencies
          # npm is still processing. A rerun skips accepted uploads and waits
          # again.
          wait_available() {
            awk 'FILENAME == ARGV[1] { accepted[$1] = $2; next } { print $1, accepted[$1] }' \
              "$RUNNER_TEMP/npm-accepted-times.txt" "$RUNNER_TEMP/npm-release.txt" > "$RUNNER_TEMP/npm-wait.txt"
            node scripts/wait-npm-available.mjs "$RUNNER_TEMP/npm-wait.txt" --interval 30 --timeout 3000
          }
          wait_available
          for pkg in packages/cli-*; do publish_dir "$pkg"; done
          publish_dir packages/compiler
          publish_dir packages/experimental
          publish_dir packages/node
          publish_dir packages/threads
          publish_dir packages/types
          wait_available
          publish_dir packages/cli
          echo "All package uploads accepted; npm registry propagation may continue after this job." >> "$GITHUB_STEP_SUMMARY"

          # Each package of the release with the time its upload was accepted,
          # when a run recorded it.
          {
            echo "uploads<<NPM_UPLOADS"
            awk 'FILENAME == ARGV[1] { accepted[$1] = $2; next } { print $1, accepted[$1] }' \
              "$RUNNER_TEMP/npm-accepted-times.txt" "$RUNNER_TEMP/npm-release.txt"
            echo "NPM_UPLOADS"
          } >> "$GITHUB_OUTPUT"

      - name: Save accepted upload receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-accepted-${{ needs.check-release.outputs.version }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/npm-accepted.txt
            ${{ runner.temp }}/npm-accepted-times.txt
          if-no-files-found: ignore
          retention-days: 90

  # Waits until every package of the release resolves on the npm registry,
  # and reports each package's time from upload to available. Fails with the
  # packages that are still missing after 2 hours. It only reads from the
  # registry; the next release run retries it, and publishing skips uploads
  # npm already accepted.
  npm-available:
    name: Wait for npm availability
    needs: [check-release, publish]
    if: >-
      !cancelled() && needs.check-release.outputs.should_release == 'true' && needs.publish.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 135
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Wait for every package to resolve
        env:
          UPLOADS: ${{ needs.publish.outputs.uploads }}
        run: |
          printf '%s\n' "$UPLOADS" > "$RUNNER_TEMP/npm-uploads.txt"
          node scripts/wait-npm-available.mjs "$RUNNER_TEMP/npm-uploads.txt"

  # Installs the release from npm, still under the next dist-tag, in a clean
  # directory on every host platform, and builds and runs a hello-world
  # program with it (scripts/release-registry-smoke.mjs). latest moves only
  # when all of them pass. 0.4.15 would have stopped here (#4011).
  registry-smoke:
    name: Smoke-test from npm (${{ matrix.platform }})
    needs: [check-release, npm-available]
    if: >-
      !cancelled() && needs.check-release.outputs.should_release == 'true' && needs.npm-available.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x64, runner: ubuntu-24.04 }
          - { platform: linux-arm64, runner: ubuntu-24.04-arm }
          - { platform: darwin-arm64, runner: macos-15 }
          - { platform: darwin-x64, runner: macos-15-intel }
          - { platform: windows-x64, runner: windows-2022 }
    runs-on: ${{ matrix.runner }}
    # An install, one build and five retries of a lagging registry edge.
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: |
            scripts/release-registry-smoke.mjs
            scripts/install-zig.sh
            scripts/toolchain.sha256
            scripts/verify-toolchain.sh
            .github/actions/zig
          sparse-checkout-cone-mode: false
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      # scriptc links Windows executables with zig (docs/content/docs/platforms.mdx), as a user's machine must.
      - name: Install Zig
        if: runner.os == 'Windows'
        uses: ./.github/actions/zig
      - name: Install, build and run hello world from npm
        run: node scripts/release-registry-smoke.mjs ${{ needs.check-release.outputs.version }}

  # Moves latest to the release once it passed on every host. Trusted
  # publishing (OIDC) authorizes npm dist-tag from npm 11.21.0, for packages
  # whose trusted publisher allows dist-tag (RELEASING.md). When this job
  # fails, the release stays under next; re-run it.
  promote:
    name: Move latest to the release
    needs: [check-release, registry-smoke]
    if: >-
      !cancelled() && needs.check-release.outputs.should_release == 'true' && needs.registry-smoke.result == 'success'
    # One promotion at a time across runs, so one run's check of latest and
    # its dist-tag update cannot interleave with another's: a release that
    # finds a newer latest leaves it. Of the promotions that wait meanwhile,
    # GitHub keeps only the newest pending one.
    concurrency:
      group: release-promote
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: Release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Point latest at the release
        env:
          VERSION: ${{ needs.check-release.outputs.version }}
        run: |
          npm install --global npm@11.21.0
          # scriptc last: until it moves, `npm i scriptc` still installs the previous release whole.
          # latest only moves forward: a retried promotion of an older release
          # leaves a newer release that already passed where it is.
          { node scripts/release-preflight.mjs --names | grep -vx scriptc; echo scriptc; } | while read -r name; do
            latest=$(npm view "$name" dist-tags.latest)
            case "$(node scripts/release-preflight.mjs --promote "$latest" "$VERSION")" in
              move) npm dist-tag add "$name@$VERSION" latest ;;
              current) echo "$name@$VERSION is already latest" ;;
              newer) echo "::warning::$name: latest is $latest, newer than $VERSION; leaving it" ;;
            esac
          done
          echo "latest is $VERSION, or a newer release, for every package of the release" >> "$GITHUB_STEP_SUMMARY"

  # Publish standalone native distributions and the surface manifest after
  # every npm package resolves and latest points at the release. The release
  # body comes from the marked changelog.
  github-release:
    name: Create GitHub Release
    needs: [check-release, publish, npm-available, promote]
    if: >-
      !cancelled() && needs.check-release.outputs.should_release == 'true' && needs.promote.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.1.3

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      # Regenerate the surface manifest from this tree and require it to
      # match the committed file exactly — the same staleness guard
      # the test suite runs — so the attached asset is provably the
      # manifest of the code being released.
      - name: Generate surface manifest
        run: |
          pnpm install --frozen-lockfile
          pnpm manifest --check

      - name: Extract changelog entry
        run: |
          VERSION="${{ needs.check-release.outputs.version }}"
          awk '/<!-- release:start -->/{found=1; next} /<!-- release:end -->/{exit} found{print}' CHANGELOG.md > /tmp/release-notes.md

          LINES=$(wc -l < /tmp/release-notes.md | tr -d ' ')
          if [ "$LINES" -lt 2 ]; then
            echo "Error: No release notes found between <!-- release:start --> and <!-- release:end --> markers in CHANGELOG.md"
            exit 1
          fi
          echo "Extracted release notes for $VERSION ($LINES lines)"

      - name: Download native distributions and runtime packs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: native-*
          path: packages
          merge-multiple: true
          run-id: ${{ needs.check-release.outputs.artifact_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Package standalone compilers
        run: node scripts/package-native-cli.mjs packages /tmp/scriptc-release-assets

      # The profile the native CLIs were built with. Runs that reuse native
      # builds from before the cli-profile job, or whose profile job failed,
      # have none; their CLIs used the committed profile.
      - name: Download the native compiler profile
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN: ${{ needs.check-release.outputs.artifact_run }}
          VERSION: ${{ needs.check-release.outputs.version }}
        run: |
          if gh run download "$RUN" --repo "$GITHUB_REPOSITORY" --name cli-profile --dir "$RUNNER_TEMP/cli-profile"; then
            mv "$RUNNER_TEMP/cli-profile/cli.profdata.gz" "/tmp/scriptc-release-assets/scriptc-$VERSION-cli.profdata.gz"
          else
            echo "Run $RUN has no cli-profile artifact"
          fi

      - name: Create GitHub Release
        run: |
          VERSION="${{ needs.check-release.outputs.version }}"
          TAG="v$VERSION"

          if gh release view "$TAG" &>/dev/null; then
            echo "Release $TAG already exists, skipping creation"
          else
            echo "Creating release $TAG..."
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "$TAG" \
              --draft \
              --notes-file /tmp/release-notes.md
          fi

          # Attach the surface manifest (idempotent: --clobber makes
          # re-runs replace the asset instead of failing).
          gh release upload "$TAG" packages/compiler/surface-manifest.json --clobber
          gh release upload "$TAG" /tmp/scriptc-release-assets/* --clobber
          gh release edit "$TAG" --draft=false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
